[package]
name = "paper-graph"
version = "0.1.0"
edition = "2021"
description = "Search a Zotero library with HawDB, BM25, and local bge-m3 embeddings"
readme = "README.md"
publish = false
rust-version = "1.97.1"

[dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
hawdb = "0.34"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.43", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"
