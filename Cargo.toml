[package]
name = "paperfs_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
bytes = "1.6"
console-subscriber = { version = "0.5", optional = true }
# console-subscriber = "0.4.1"
dav-server = "0.8"
dav-server-opendalfs = "0.7"
env_logger = "0.11"
futures = "0.3"
http = "1.1"
http-body = "1.0"
log = { version = "0.4", features = ["std"] }
oauth2 = "5.0"
opendal = { version = "0.55", features = ["services-onedrive", "layers-tracing"] }
reqwest = { version = "0.12", features = ["json"] }
serde = "1.0"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.38", features = ["full", "tracing"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tower-layer = "0.3"
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
console-subscriber = ["dep:console-subscriber"]

# Using local patched opendal for OneDrive upload fix
# See: https://github.com/apache/opendal/issues/...
[patch.crates-io]
opendal = { path = "../opendal/core" }
